[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kloudlite"
version = "0.1.1"
description = "Download models and datasets from Hugging Face or the Kloudlite hub"
requires-python = ">=3.9"
dependencies = ["huggingface_hub"]
readme = "README.md"

[tool.setuptools]
packages = ["kloudlite"]

[project.urls]
Source = "https://github.com/kloudlite/kloudlite-sdk"
